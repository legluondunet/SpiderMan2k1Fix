name: "Feature request"
description: "Suggest an improvement or new capability for SpiderMan2k1Fix."
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion! Please check
        [existing issues](https://github.com/legluondunet/SpiderMan2k1Fix/issues)
        and the [ideas for future versions](https://github.com/legluondunet/SpiderMan2k1Fix#ideas-for-future-versions)
        before opening a request.

        Suggestions are welcome, but implementation is **not guaranteed**
        and depends on the technical limitations of the patch.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: "I have searched existing requests and understand that implementation is not guaranteed."
          required: true

  - type: dropdown
    id: category
    attributes:
      label: Area
      options:
        - "Display / widescreen / HUD"
        - "Gameplay / FPS"
        - "Audio"
        - "Input / controls"
        - "Saves / quality of life"
        - "Cheats / customization"
        - "Graphics / HD / modding"
        - "Additional content"
        - "Achievements"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Describe the feature
      description: "What change or new behavior would you like?"
      placeholder: "I would like the patch to ..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why would this be useful?
      description: "Describe the player problem it would solve, or give an example use case."
      placeholder: "Currently ...; this would allow ..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or implementation ideas (optional)
      description: "Existing workarounds, references, screenshots, or technical suggestions."
    validations:
      required: false
