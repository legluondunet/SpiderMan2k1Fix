name: SpiderMan2k1Fix Windows x86

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spiderman2k1fix-windows-x86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x86:
    name: Build SpiderMan2k1Fix (32-bit MSVCRT)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Configure Python for regression tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run regression tests
        run: python3 -m pytest -q ChatGPT/tests

      - name: Investigate native initActionMaps binary in public decomp (temporary)
        continue-on-error: true
        run: |
          curl -fsSL --max-time 15 'https://raw.githubusercontent.com/krystalgamer/spidey-decomp/master/tools/functions/5296368.bin' -o /tmp/spider-initActionMaps.bin
          echo '--- binary sha and size ---'
          sha256sum /tmp/spider-initActionMaps.bin
          wc -c /tmp/spider-initActionMaps.bin
          echo '--- original x86 initActionMaps disassembly ---'
          objdump -D -b binary -m i386 -M intel --adjust-vma=0x50d0f0 /tmp/spider-initActionMaps.bin | tail -115
          echo '--- original restore string/search ---'
          strings /tmp/spider-initActionMaps.bin | tail -20

      - name: Parse PowerShell native audio loader probe
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $path = (Resolve-Path 'ChatGPT/tools/Inspect-SpiderManAudioLoader.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host 'PowerShell audio loader script syntax validated.'

      - name: Build Windows x86 DLLs (portable LLVM-MinGW MSVCRT)
        run: bash ./build-native-msvcrt.sh

      - name: Prepare game installation files
        run: |
          mkdir -p dist/package
          cp SpiderMan2k1Fix.dll winmm.dll README.md CHANGELOG.md dist/package/

      - name: Verify packaged README and CHANGELOG
        run: |
          test -s dist/package/README.md
          test -s dist/package/CHANGELOG.md
          cmp README.md dist/package/README.md
          cmp CHANGELOG.md dist/package/CHANGELOG.md
          python3 -c 'import pathlib,re; s=pathlib.Path("dist/package/README.md").read_text(encoding="utf-8"); assert not re.search(r"(?m)^- \*\*\s", s), "Malformed bold Markdown bullet in README.md"'
          echo "README.md and CHANGELOG.md match the checked-out sources."
          sha256sum README.md dist/package/README.md CHANGELOG.md dist/package/CHANGELOG.md

      - name: Upload Windows DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpiderMan2k1Fix-Windows-x86
          path: dist/package/
          if-no-files-found: error
          retention-days: 30
