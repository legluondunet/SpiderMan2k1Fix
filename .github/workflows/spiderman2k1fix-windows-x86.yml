name: SpiderMan2k1Fix Windows x86

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spiderman2k1fix-windows-x86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x86:
    name: Build SpiderMan2k1Fix (32-bit MSVCRT)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Configure Python for regression tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run regression tests
        run: python3 -m pytest -q ChatGPT/tests

      - name: Build Windows x86 DLLs (portable LLVM-MinGW MSVCRT)
        run: bash ./build-native-msvcrt.sh

      - name: Prepare game installation files
        run: |
          mkdir -p dist/package
          cp SpiderMan2k1Fix.dll winmm.dll README.md CHANGELOG.md dist/package/

      - name: Bundle pinned SDL3 x86 DLL for opt-in F7 experiment
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/sdl3-x86.zip "https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18-win32-x86.zip"
          echo "99f2ee6e126d828c5e5b3d20201930f3d16a8c6e147d1de90a59f4ae6df138c9  /tmp/sdl3-x86.zip" | sha256sum -c -
          unzip -p /tmp/sdl3-x86.zip SDL3.dll > dist/package/SDL3.dll
          objdump -f dist/package/SDL3.dll | grep -q pei-i386

      - name: Upload Windows DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpiderMan2k1Fix-Windows-x86
          path: dist/package/
          if-no-files-found: error
          retention-days: 30
