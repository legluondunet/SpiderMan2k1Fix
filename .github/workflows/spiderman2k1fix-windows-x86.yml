name: SpiderMan2k1Fix Windows x86

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spiderman2k1fix-windows-x86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x86:
    name: Build SpiderMan2k1Fix (32-bit MSVCRT)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install MinGW-w64 and binary inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 python3-pytest zip unzip

      - name: Run regression tests
        run: |
          python3 -m pytest -q tests

      - name: Build Windows x86 DLLs
        run: bash ./build.sh

      - name: Package game installation files
        # Never package SpiderMan2k1Fix.ini: the game generates it if missing,
        # and shipping defaults overwrites custom user settings on upgrades.
        run: |
          mkdir -p dist/package
          cp SpiderMan2k1Fix.dll winmm.dll README.md CHANGELOG.md dist/package/
          (cd dist/package && zip -9 ../SpiderMan2k1Fix-Windows-x86.zip SpiderMan2k1Fix.dll winmm.dll README.md CHANGELOG.md)
          if unzip -Z1 dist/SpiderMan2k1Fix-Windows-x86.zip | grep -Fxq SpiderMan2k1Fix.ini; then echo "ERROR: archive must not overwrite user INI"; exit 1; fi

      - name: Upload Windows DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpiderMan2k1Fix-Windows-x86
          path: dist/SpiderMan2k1Fix-Windows-x86.zip
          if-no-files-found: error
          retention-days: 30
