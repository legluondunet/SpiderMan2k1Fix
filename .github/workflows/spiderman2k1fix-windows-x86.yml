name: SpiderMan2k1Fix Windows x86

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spiderman2k1fix-windows-x86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x86:
    name: Build SpiderMan2k1Fix (32-bit MSVCRT)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install MinGW-w64 and binary inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 python3-pytest

      - name: Run regression tests
        run: |
          python3 -m pytest -q ChatGPT/tests

      - name: Build Windows x86 DLLs
        run: bash ./build.sh

      - name: Prepare game installation files
        run: |
          mkdir -p dist/package
          cp SpiderMan2k1Fix.dll winmm.dll README.md CHANGELOG.md dist/package/

      - name: Verify packaged README and CHANGELOG
        run: |
          test -s dist/package/README.md
          test -s dist/package/CHANGELOG.md
          cmp README.md dist/package/README.md
          cmp CHANGELOG.md dist/package/CHANGELOG.md
          python3 -c 'import pathlib,re; s=pathlib.Path("dist/package/README.md").read_text(encoding="utf-8"); assert not re.search(r"(?m)^- \\*\\*\\s", s), "Malformed bold Markdown bullet in README.md"'
          echo "README.md and CHANGELOG.md match the checked-out sources."
          sha256sum README.md dist/package/README.md CHANGELOG.md dist/package/CHANGELOG.md

      - name: Upload Windows DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpiderMan2k1Fix-Windows-x86
          path: dist/package/
          if-no-files-found: error
          retention-days: 30
