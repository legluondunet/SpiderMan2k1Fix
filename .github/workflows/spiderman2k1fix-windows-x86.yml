name: SpiderMan2k1Fix Windows x86

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spiderman2k1fix-windows-x86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x86:
    name: Build SpiderMan2k1Fix (32-bit MSVCRT)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Configure Python for regression tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run regression tests
        run: python3 -m pytest -q ChatGPT/tests

      - name: Parse PowerShell native audio loader probe
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $path = (Resolve-Path 'ChatGPT/tools/Inspect-SpiderManAudioLoader.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host 'PowerShell audio loader script syntax validated.'

      - name: Build Windows x86 DLLs (portable LLVM-MinGW MSVCRT)
        run: bash ./build-native-msvcrt.sh

      - name: Prepare game installation files
        run: |
          mkdir -p dist/package/SpiderMan2k1Fix
          cp winmm.dll dist/package/
          cp SpiderMan2k1Fix.dll README.md CHANGELOG.md dist/package/SpiderMan2k1Fix/

      - name: Bundle pinned upstream SDL3 Windows x86 runtime and license
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$RUNNER_TEMP/SDL3-3.4.18-win32-x86.zip" \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18-win32-x86.zip
          python3 scripts/package_sdl3_x86.py dist/package/SpiderMan2k1Fix \
            --archive "$RUNNER_TEMP/SDL3-3.4.18-win32-x86.zip"
          test -s dist/package/SpiderMan2k1Fix/SDL3.dll
          test -s dist/package/SpiderMan2k1Fix/SDL3-LICENSE.txt

      - name: Verify packaged README and CHANGELOG
        run: |
          test -s dist/package/winmm.dll
          test -s dist/package/SpiderMan2k1Fix/SpiderMan2k1Fix.dll
          test -s dist/package/SpiderMan2k1Fix/README.md
          test -s dist/package/SpiderMan2k1Fix/CHANGELOG.md
          test -s dist/package/SpiderMan2k1Fix/SDL3.dll
          # No inner archives: GitHub Actions compresses dist/package/ once.
          test -z "$(find dist/package -type f -iname '*.zip' -print -quit)"
          cmp third_party/SDL3-LICENSE.txt dist/package/SpiderMan2k1Fix/SDL3-LICENSE.txt
          cmp README.md dist/package/SpiderMan2k1Fix/README.md
          cmp CHANGELOG.md dist/package/SpiderMan2k1Fix/CHANGELOG.md
          python3 -c 'import pathlib,re; s=pathlib.Path("dist/package/SpiderMan2k1Fix/README.md").read_text(encoding="utf-8"); assert not re.search(r"(?m)^- \*\*\s", s), "Malformed bold Markdown bullet in README.md"'
          echo "README.md and CHANGELOG.md match the checked-out sources."
          sha256sum README.md dist/package/SpiderMan2k1Fix/README.md CHANGELOG.md dist/package/SpiderMan2k1Fix/CHANGELOG.md

      - name: Build release-ready ZIP and SHA256 (do not publish)
        run: |
          set -euo pipefail
          version=$(sed -n 's/^#define SPIDERMAN2K1FIX_VERSION "\([^"]*\)"/\1/p' version_info.h)
          test -n "$version"
          commit="${GITHUB_SHA:0:7}"
          stem="SpiderMan2k1Fix-v${version}-${commit}-Windows-x86"
          mkdir -p dist/release
          (
            cd dist/package
            zip -q -9 "../release/${stem}.zip" \
              winmm.dll \
              SpiderMan2k1Fix/SpiderMan2k1Fix.dll \
              SpiderMan2k1Fix/SDL3.dll \
              SpiderMan2k1Fix/SDL3-LICENSE.txt \
              SpiderMan2k1Fix/README.md \
              SpiderMan2k1Fix/CHANGELOG.md
          )
          (
            cd dist/release
            sha256sum "${stem}.zip" > "${stem}.zip.sha256"
            unzip -Z -1 "${stem}.zip" | sort > actual.txt
            printf '%s\n' \
              winmm.dll \
              SpiderMan2k1Fix/SpiderMan2k1Fix.dll \
              SpiderMan2k1Fix/SDL3.dll \
              SpiderMan2k1Fix/SDL3-LICENSE.txt \
              SpiderMan2k1Fix/README.md \
              SpiderMan2k1Fix/CHANGELOG.md | sort > expected.txt
            diff -u expected.txt actual.txt
          )

      # upload-artifact ALWAYS creates the ONE ZIP downloaded from Actions.
      # Upload the install tree, not our own release .zip, to avoid ZIP-in-ZIP.
      # The versioned release ZIP + SHA256 above remain available to a future
      # official release/publish job, but are not uploaded as an Actions artifact.
      - name: Upload installation files as one ZIP (no nested ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: SpiderMan2k1Fix-Windows-x86
          path: dist/package/
          if-no-files-found: error
          retention-days: 30
