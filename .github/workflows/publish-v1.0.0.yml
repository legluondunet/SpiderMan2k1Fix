name: Publish SpiderMan2k1Fix v1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.0.0.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spiderman2k1fix-publish-v1.0.0
  cancel-in-progress: false

jobs:
  publish:
    name: Test, build and publish Windows x86 release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out release sources
        uses: actions/checkout@v4

      - name: Install Windows x86 build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 python3-pytest zip unzip

      - name: Run regression tests
        run: python3 -m pytest -q tests

      - name: Compile and validate Windows x86 DLLs
        run: bash ./build.sh

      - name: Package release and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -j -9 dist/SpiderMan2k1Fix-1.0.0-Windows-x86.zip \
            winmm.dll SpiderMan2k1Fix.dll SpiderMan2k1Fix.ini README.md CHANGELOG.md
          unzip -t dist/SpiderMan2k1Fix-1.0.0-Windows-x86.zip
          (cd dist && sha256sum SpiderMan2k1Fix-1.0.0-Windows-x86.zip > SHA256SUMS.txt)

      - name: Publish official v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists; refusing to overwrite."
            exit 0
          fi
          gh release create v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SpiderMan2k1Fix v1.0.0" \
            --notes-file RELEASE_NOTES_v1.0.0.md \
            dist/SpiderMan2k1Fix-1.0.0-Windows-x86.zip \
            dist/SHA256SUMS.txt
