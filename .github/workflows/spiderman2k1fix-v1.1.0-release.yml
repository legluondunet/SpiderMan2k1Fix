name: Publish SpiderMan2k1Fix v1.1.0

# One-shot release job: only the explicitly reviewed release merge commit
# on the project's main branch may publish this exact version.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-v1-1-0:
    if: >-
      github.repository == 'legluondunet/SpiderMan2k1Fix' &&
      startsWith(github.event.head_commit.message, 'release: publish SpiderMan2k1Fix v1.1.0')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@v4

      - name: Confirm version
        run: |
          grep -Fx '#define SPIDERMAN2K1FIX_VERSION "1.1.0"' version_info.h
          test -s RELEASE_NOTES_1.1.0.md
          test -s CHANGELOG.md
          if git ls-remote --tags origin refs/tags/v1.1.0 | grep -q 'refs/tags/v1.1.0'; then
            echo "ERROR: v1.1.0 tag already exists. Refusing to overwrite."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run full regression suite
        run: python3 -m pytest -q ChatGPT/tests

      - name: Validate Windows PowerShell diagnostic parser
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $source = (Resolve-Path 'ChatGPT/tools/Inspect-SpiderManAudioLoader.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($source, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Build verified Windows x86 MSVCRT DLLs
        run: bash ./build-native-msvcrt.sh

      - name: Create installer-free release package and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -j -9 dist/SpiderMan2k1Fix-1.1.0-Windows-x86.zip \
            winmm.dll SpiderMan2k1Fix.dll README.md CHANGELOG.md
          (
            cd dist
            sha256sum SpiderMan2k1Fix-1.1.0-Windows-x86.zip > SpiderMan2k1Fix-1.1.0-Windows-x86.zip.sha256
            unzip -Z -1 SpiderMan2k1Fix-1.1.0-Windows-x86.zip | sort > files.txt
            printf '%s\n' CHANGELOG.md README.md SpiderMan2k1Fix.dll winmm.dll | sort > expected.txt
            diff -u expected.txt files.txt
          )
          test -s dist/SpiderMan2k1Fix-1.1.0-Windows-x86.zip
          test -s dist/SpiderMan2k1Fix-1.1.0-Windows-x86.zip.sha256

      - name: Upload exact release build as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpiderMan2k1Fix-v1.1.0-Windows-x86
          path: |
            dist/SpiderMan2k1Fix-1.1.0-Windows-x86.zip
            dist/SpiderMan2k1Fix-1.1.0-Windows-x86.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub release after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0 \
            dist/SpiderMan2k1Fix-1.1.0-Windows-x86.zip \
            dist/SpiderMan2k1Fix-1.1.0-Windows-x86.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "SpiderMan2k1Fix v1.1.0" \
            --notes-file RELEASE_NOTES_1.1.0.md
          gh release view v1.1.0 --json url,tagName,isDraft,isPrerelease
