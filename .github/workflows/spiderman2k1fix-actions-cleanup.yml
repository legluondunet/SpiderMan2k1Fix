name: Prune old SpiderMan2k1Fix Actions history

on:
  # Keep the newest successful unified build whenever it finishes on main.
  workflow_run:
    workflows: ["SpiderMan2k1Fix x86 (unified development)"]
    types: [completed]
    branches: [main]
  # The cleanup re-dispatches itself while old runs remain. Hourly runs
  # act as a fallback if the shared GITHUB_TOKEN API budget runs low.
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: spiderman2k1fix-actions-prune
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out safe cleanup script
        uses: actions/checkout@v4
      - name: Keep latest EXE, remove old runs/logs and requeue if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prune_actions_history.py
