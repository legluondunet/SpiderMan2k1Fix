; SpiderMan2k1Fix.ini - generated automatically when missing.
; Changes made in the game's options are saved to this file.
; Edit this file while the game is not running. Invalid files are backed up as SpiderMan2k1Fix_N.old.

[Debug]
; 1 = write SpiderMan2k1Fix.log (debug); 0 = no log output. Restart to apply.
Log=0
; Detailed F10 reverse-engineering probes, optional (default 0).
; Normal log retains native script transitions and shutdown results.
F10VerboseTrace=0

[Display]
; Auto = desktop monitor resolution
Resolution=Auto
; Auto or 4:3 for a native gaming experience
AspectRatio=Auto
; Brightness: 0..9. FPSLimit: 0 disables; otherwise 1..240.
Brightness=4
FPSLimit=30
; Development flags needed to preserve the currently tested rendering behaviour.
ExperimentalFOVAspect=1
ExperimentalComicNativeAspect=1

[HUD]
; HUD and native ESC 4:3 master: enabled by default; 0 explicitly disables it.
HUDWidescreenFix=1

[Input]
; 1 = use the game's native Acquire/retry for DIERR_NOTACQUIRED after Alt+Tab.
; Windows 11 tested with PauseOnFocusLoss=1 and Any-key wake.
; Validated on the supported Windows 11 setup; disabled by default for compatibility.
DirectInputReacquire=0
; Experimental prevention of Windows Ghost windows and false focus pauses (0=off).
; WARNING: disables normal Windows hang-window controls until game exits.
DisableWindowsGhosting=0
; Pause at DirectDraw Flip after focus loss; optional media pausing is below.
PauseOnFocusLoss=0
; Press and release ANY keyboard key after returning to resume.
; Legacy F9/Space pause-key choices in older INIs are ignored.
; 1 = show centered transparent pause reminder with red outline, 0 = hide.
PauseOverlay=1
; 1 = darken the paused scene behind the message; 0 = no shade.
PauseDim=1
; Shade opacity: 0..90 percent (default 50 = smoother pause).
PauseDimOpacity=50
; Default 0 = clean shaded pause; set 1 to restore the optional 16px grid.
PauseGrid=0
; Restore the Windows pointer while another app has focus.
RestoreCursorOnFocusLoss=1
; Pause Bink cinematics and audio-only Bink music on focus loss. Default OFF.
PauseBinkOnFocusLoss=0
; Pause only playing game-owned DirectSound secondary buffers. Default OFF.
PauseDirectSoundOnFocusLoss=0
; Focus and DirectInput factory diagnostics (disabled by default).
ExperimentalFocusTrace=0
; Entry-only factory probe: requires ExperimentalFocusTrace=1.
ExperimentalDI8EntryTrace=0

[Audio]
; All levels are 0..100 percent, with lossless raw values kept below.
MusicSFXLevel=69
VoiceLevel=79
MovieLevel=69
; 1 = Stereo, 0 = Mono (the game's internal flag is inverted).
Stereo=1

[Keyboard]
; Keyboard bindings use physical DirectInput scan codes.
; Use names like SPACE, F, UP or numeric 0xNNNNNNNN.
; Unrecognized raw binding codes are preserved as 0xNNNNNNNN.
Up=UP
Down=DOWN
Left=LEFT
Right=RIGHT
Jump=SPACE
Kick=X
Punch=C
Web=V
Aim=D
Zipline=F
Swing=G

[Joystick]
; Buttons are numbered from zero, as shown in the game menu.
; Joystick movement/axis parameters are preserved in [Internal] RawHex.
Jump=BUTTON3
Kick=BUTTON4
Punch=BUTTON0
Web=BUTTON1
Aim=BUTTON6
Zipline=BUTTON9
Swing=BUTTON7

[Internal]
; Raw 252-byte Spidey.cfg image, including unidentified settings.
; Do not edit RawHex manually.

