; SpiderMan2k1Fix.ini - generated automatically when missing.
; User settings only. Built-in video/HUD/focus fixes are always enabled.
; Edit while the game is closed; invalid INIs are backed up before repair.

[Debug]
; 1 = write SpiderMan2k1Fix.log; 0 = no log (default).
Log=0

[Display]
; Auto = monitor aspect ratio, 4:3 = original presentation.
AspectRatio=Auto
; Brightness: 0..9. FPSLimit: 0 disables; otherwise 1..240.
Brightness=4
FPSLimit=30

[Input]
; Auto = OS keyboard layout; Off = original physical QWERTY positions.
KeyboardLayout=Auto
; ControllerProfile: Auto detects an original Sony DualShock4 by VID/PID.
; Other gamepads keep original controls. Off disables this UI bridge.
ControllerProfile=Auto
; In 2D menus and native Bink movies (including after menu): Cross/Options = Enter.
ControllerEnterButtons=Both
; Circle = Escape/Back in 2D menus. Share/Off are alternatives.
; Triangle stays native for 3D cinematic skipping.
ControllerBackButton=Circle
; In 3D, OPTIONS = Escape/Pause only if no original gameplay action uses
; BUTTON9 (Zipline does by default). First reassign Zipline, e.g. R1/BUTTON5,
; inside the game's Joystick settings. Original bindings are not overwritten.
ControllerPauseButton=Options

[Audio]
; All levels are 0..100 percent, with lossless raw values kept below.
MusicSFXLevel=69
VoiceLevel=79
MovieLevel=69
; 1 = Stereo, 0 = Mono (the game's internal flag is inverted).
Stereo=1

[Keyboard]
; Keyboard bindings use physical DirectInput scan codes.
; Use names like SPACE, F, UP or numeric 0xNNNNNNNN.
; Unrecognized raw binding codes are preserved as 0xNNNNNNNN.
Up=UP
Down=DOWN
Left=LEFT
Right=RIGHT
Jump=SPACE
Kick=X
Punch=C
Web=V
Aim=D
Zipline=F
Swing=G

[Joystick]
; Buttons are numbered from zero, as shown in the game menu.
; Joystick movement/axis parameters are preserved in [Internal] RawHex.
Jump=BUTTON3
Kick=BUTTON4
Punch=BUTTON0
Web=BUTTON1
Aim=BUTTON6
Zipline=BUTTON9
Swing=BUTTON7

[Internal]
; Raw 252-byte Spidey.cfg image, including unidentified settings.
; Do not edit RawHex manually.

