; SpiderMan2k1Fix.ini - generated automatically when missing.
; User settings only. SDL3 controls and built-in fixes are always enabled.
; Edit while the game is closed; invalid INIs are backed up before repair.

[Debug]
; 1 = write SpiderMan2k1Fix.log; 0 = no log (default).
Log=0

[Display]
; Auto = monitor aspect ratio, 4:3 = original presentation.
AspectRatio=Auto
; Brightness: 0..9. FPSLimit: 0 disables; otherwise 1..240.
Brightness=4
FPSLimit=30

[Input]
; Auto = OS keyboard layout; Off = original physical QWERTY positions.
KeyboardLayout=Auto
; SDL3 is the sole controller backend; profiles live in controllers/.
; Mapped SDL3 devices are selected with Start and a neutral press/release gate.
; Native joystick mappings remain inert but preserved in RawHex.
; Safe Left Alt repair after Alt+Tab is built in, no player switch.

[Audio]
; All levels are 0..100 percent, with lossless raw values kept below.
MusicSFXLevel=40
VoiceLevel=60
MovieLevel=40
; 1 = Stereo, 0 = Mono (the game's internal flag is inverted).
Stereo=1

[Keyboard]
; Keyboard bindings use physical DirectInput scan codes.
; Use names like SPACE, F, UP or numeric 0xNNNNNNNN.
; Unrecognized raw binding codes are preserved as 0xNNNNNNNN.
Up=UP
Down=DOWN
Left=LEFT
Right=RIGHT
Jump=SPACE
Kick=X
Punch=C
Web=V
Aim=D
Zipline=F
Swing=G

[Internal]
; Raw 252-byte Spidey.cfg image, including inactive original joystick bytes.
; Do not edit RawHex manually.

