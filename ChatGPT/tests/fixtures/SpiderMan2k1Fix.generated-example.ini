; SpiderMan2k1Fix.ini - generated automatically when missing.
; Generated by SpiderMan2k1Fix v2.0.0-rc.2-test-fixture
; Edit while the game is closed; invalid INIs are backed up before repair.

[Debug]
; 1 = write SpiderMan2k1Fix.log; 0 = no log (default).
Log=0

[Display]
; Auto = monitor aspect ratio, 4:3 = original presentation.
AspectRatio=Auto
; Brightness: 0 = darkest, 9 = brightest (default 4).
Brightness=4
; FPSLimit: target frames per second, 0 = unlimited (default 30).
FPSLimit=30

[Input]
; Auto = OS keyboard layout; Off = original physical QWERTY positions.
KeyboardLayout=Auto

[Audio]
; MusicSFXLevel: music and sound-effects volume (0..100%).
MusicSFXLevel=40
; VoiceLevel: dialogue and character-voice volume (0..100%).
VoiceLevel=60
; MovieLevel: cutscene/movie volume (0..100%).
MovieLevel=40
; 1 = Stereo, 0 = Mono (the game's internal flag is inverted).
Stereo=1

[Keyboard]
; Keyboard bindings use physical DirectInput scan codes.
; Use names like SPACE, F, UP or numeric 0xNNNNNNNN.
; Unrecognized raw binding codes are preserved as 0xNNNNNNNN.
; Up: move up / forward.
Up=UP
; Down: move down / backward.
Down=DOWN
; Left: move left.
Left=LEFT
; Right: move right.
Right=RIGHT
; Jump: jump.
Jump=SPACE
; Kick: kick attack.
Kick=X
; Punch: punch attack.
Punch=C
; Web: use web attack.
Web=V
; Aim: aim.
Aim=D
; Zipline: web zipline.
Zipline=F
; Swing: web swing.
Swing=G

[Internal]
; Raw 252-byte Spidey.cfg image, including inactive original joystick bytes.
; Do not edit RawHex manually.

