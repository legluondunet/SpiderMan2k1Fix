; SpiderMan2k1Fix.ini - generated automatically when missing.
; Changes made in the game's options are saved to this file.
; Edit this file while the game is not running. Invalid files are backed up as SpiderMan2k1Fix_N.old.

[Debug]
; 1 = write SpiderMan2k1Fix.log (debug); 0 = no log output. Restart to apply.
Log=0

[Display]
; Auto = desktop monitor resolution
Resolution=Auto
; Auto or 4:3 for a native gaming experience
AspectRatio=Auto
; Brightness: 0..9. FPSLimit: 0 disables; otherwise 1..240.
Brightness=4
FPSLimit=30
; Development flags needed to preserve the currently tested rendering behaviour.
ExperimentalFOVAspect=1
ExperimentalComicNativeAspect=1

[HUD]
; Experimental HUD-wide geometry fix is not validated.
HUDWidescreenFix=0

[Input]
; Opt-in native DirectInput error recovery after Alt+Tab; 0 = disabled.
DirectInputReacquire=0
; Experimental Windows Ghost suppression, reversible only by restarting (default OFF).
DisableWindowsGhosting=0
; Experimental pause at DirectDraw Flip on focus loss, 0 = disabled.
PauseOnFocusLoss=0
; Any key resumes focus pause (keypress + release consumed; no F9/Space mode).
; Show a centered transparent red-outline pause reminder while paused (default ON).
PauseOverlay=1
; 1 = dim the paused game scene (default ON); 0 = no shade.
PauseDim=1
; Shade opacity from 0..90 percent (default 55).
PauseDimOpacity=55
; 1 = subtle square grid every 16 pixels; 0 = smooth shade only.
PauseGrid=1
RestoreCursorOnFocusLoss=1
; Pause native Bink cinematics and audio-only Bink music. Default OFF.
PauseBinkOnFocusLoss=0
; Pause only active game-owned DirectSound secondary voices. Default OFF.
PauseDirectSoundOnFocusLoss=0
ExperimentalFocusTrace=0
ExperimentalDI8EntryTrace=0

[Audio]
; All levels are 0..100 percent, with lossless raw values kept below.
MusicSFXLevel=69
VoiceLevel=79
MovieLevel=69
; 1 = Stereo, 0 = Mono (the game's internal flag is inverted).
Stereo=1

[Keyboard]
; Keyboard bindings use physical DirectInput scan codes.
; Use names like SPACE, F, UP or numeric 0xNNNNNNNN.
; Unrecognized raw binding codes are preserved as 0xNNNNNNNN.
Up=UP
Down=DOWN
Left=LEFT
Right=RIGHT
Jump=SPACE
Kick=X
Punch=C
Web=V
Aim=D
Zipline=F
Swing=G

[Joystick]
; Buttons are numbered from zero, as shown in the game menu.
; Joystick movement/axis parameters are preserved in [Internal] RawHex.
Jump=BUTTON3
Kick=BUTTON4
Punch=BUTTON0
Web=BUTTON1
Aim=BUTTON6
Zipline=BUTTON9
Swing=BUTTON7

[Internal]
; Raw 252-byte Spidey.cfg image, including unidentified settings.
; Do not edit RawHex manually.

